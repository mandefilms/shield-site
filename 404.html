<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page Not Found | Mya'Shield</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Fraunces:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root { --navy: #1E3A5F; --coral: #FF6B6B; --white: #FFFFFF; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 16px; background: var(--navy); color: var(--white); font-family: 'Outfit', sans-serif; text-align: center; }
    img { width: 96px; height: 96px; display: block; margin: 0 auto 24px; }
    h1 { font-family: 'Fraunces', serif; font-size: clamp(1.9rem, 5vw, 2.8rem); line-height: 1.15; margin: 0 0 12px; }
    p { font-size: 1.05rem; line-height: 1.75; opacity: 0.8; margin: 0 0 28px; }
    a.btn-primary { display: inline-block; background: var(--coral); color: var(--white); padding: 14px 28px; border-radius: 100px; font-weight: 700; font-size: 1rem; text-decoration: none; }
    a.btn-primary:hover { opacity: 0.88; }
  </style>
</head>
<body>
  <main>
    <!-- Absolute paths: Netlify serves this page at whatever address was mistyped, including nested ones -->
    <img src="/shield-logo-light-160.png" alt="Mya'Shield" />
    <h1>Page not found</h1>
    <p>Sorry, we couldn't find that page.</p>
    <a href="/" class="btn-primary">Back to the homepage</a>
  </main>
</body>
</html>
